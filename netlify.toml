[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18.20.6"
  NPM_VERSION = "10.8.2"
  NEXT_PRIVATE_STANDALONE = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/**", ".next/**"]
  external_node_modules = ["@next/font", "next"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Use Netlify's built-in handling for Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle API routes and server-side rendering
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/netlify"
  status = 200

# Handle all other routes
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/netlify"
  status = 200